<div class="qt-root" id="qt-root" role="region" aria-label="Words on love"><div class="qt-card"><p class="qt-eyebrow">Words on love</p><div class="qt-stage"><figure class="qt-slide on"><p>“Love is not something we give or get; it is something that we nurture and grow.”</p><figcaption class="qt-by"><span class="qt-av" aria-hidden="true" style="display:grid">B</span><div><b>Brené Brown</b><span>Author and researcher</span></div></figcaption></figure><figure class="qt-slide"><p>“Love recognizes no barriers. It jumps hurdles, leaps fences, penetrates walls to arrive at its destination full of hope.”</p><figcaption class="qt-by"><span class="qt-av" aria-hidden="true" style="display:grid">M</span><div><b>Maya Angelou</b><span>Poet and author</span></div></figcaption></figure><figure class="qt-slide"><p>“Lots of people want to ride with you in the limo, but you want someone who will take the bus with you when the limo breaks down.”</p><figcaption class="qt-by"><span class="qt-av" aria-hidden="true" style="display:grid">O</span><div><b>Oprah Winfrey</b><span>Media icon</span></div></figcaption></figure><figure class="qt-slide"><p>“Spread love everywhere you go. Let no one ever come to you without leaving happier.”</p><figcaption class="qt-by"><span class="qt-av" aria-hidden="true" style="display:grid">M</span><div><b>Mother Teresa</b><span>Humanitarian</span></div></figcaption></figure></div><div class="qt-dots"><button type="button" aria-label="Quote 1" class="on"></button><button type="button" aria-label="Quote 2"></button><button type="button" aria-label="Quote 3"></button><button type="button" aria-label="Quote 4"></button></div></div></div>
