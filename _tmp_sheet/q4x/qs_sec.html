<section class="qs-sec" aria-label="Words on love"><div class="hx-wrap"><div class="qs-head"><span class="qs-eyebrow">Words on love</span><h2>Love, <em>in their words.</em></h2></div><ul class="qs-grid"><li><figure class="qs-card"><div class="qs-ph"><img src="img/quotes/taylor-swift.webp" width="360" height="360" alt="Taylor Swift" loading="lazy" decoding="async" /></div><div class="qs-body"><span class="qs-mark" aria-hidden="true">“</span><blockquote>When you are missing someone, time seems to move slower, and when I’m falling in love with someone, time seems to be moving faster.</blockquote><figcaption class="qs-by"><b>Taylor Swift</b><span>Singer-songwriter</span></figcaption></div></figure></li><li><figure class="qs-card"><div class="qs-ph"><img src="img/quotes/will-smith.webp" width="360" height="360" alt="Will Smith" loading="lazy" decoding="async" /></div><div class="qs-body"><span class="qs-mark" aria-hidden="true">“</span><blockquote>The central idea of love is not even a relationship commitment, the first thing is a personal commitment to be the best version of yourself with or without that person that you’re with.</blockquote><figcaption class="qs-by"><b>Will Smith</b><span>Actor</span></figcaption></div></figure></li><li><figure class="qs-card"><div class="qs-ph"><img src="img/quotes/george-clooney.webp" width="360" height="360" alt="George Clooney" loading="lazy" decoding="async" /></div><div class="qs-body"><span class="qs-mark" aria-hidden="true">“</span><blockquote>Just because you’re with someone it doesn’t mean you’re incredibly happy and complete.</blockquote><figcaption class="qs-by"><b>George Clooney</b><span>Actor and filmmaker</span></figcaption></div></figure></li></ul></div></section>
