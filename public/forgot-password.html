<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password · RelationshipAI</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
  <link rel="icon" href="/favicon-48.png?v=3" sizes="48x48" type="image/png" />
  <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16.png?v=3" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=65" />
  <link rel="stylesheet" href="css/app-theme.css?v=4" />
  <script src="js/i18n.js?v=1"></script>
</head>
<body>

  <div class="auth-page">
    <a href="https://relationshipaiadvice.com/" class="brand auth-brand"><img class="brand-mark" src="logo-mark.svg" alt="" width="40" height="40" style="display:block;margin:0 auto 10px" /><b class="brand-text">Relationship<span>AI</span></b></a>

    <div class="auth-card">
      <img class="peek auth-peek" src="img/peek-candle.svg" alt="" width="58" height="106" />
      <h1>Reset your password</h1>
      <p class="text-muted">Enter the email on your account and we'll send you a link to set a new password.</p>

      <div class="form-error" id="form-error" style="display:none;"></div>
      <div class="success-banner" id="form-success" style="display:none;"></div>

      <form id="forgot-password-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <button type="submit" class="btn btn-gradient btn-block">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>

  <script src="js/shared.js?v=23"></script>
  <script src="js/auth-forms.js?v=11"></script>
</body>
</html>
