<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · RelateIQ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=27" />
</head>
<body>

  <div class="auth-page">
    <a href="index.html" class="brand auth-brand">Relate<span>IQ</span></a>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="text-muted">Log in to pick up where you left off.</p>

      <div class="form-error" id="form-error" style="display:none;"></div>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />

        <button type="submit" class="btn btn-gradient btn-block">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </div>

  <script src="js/shared.js?v=9"></script>
  <script src="js/auth-forms.js?v=5"></script>
</body>
</html>
