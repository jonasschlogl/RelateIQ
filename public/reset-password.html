<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a new password · RelationshipAI</title>
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png?v=2" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=56" />
</head>
<body>

  <div class="auth-page">
    <a href="index.html" class="brand auth-brand"><img class="brand-mark" src="logo-mark.svg" alt="" width="40" height="40" style="display:block;margin:0 auto 10px" />Relationship<span>AI</span></a>

    <div class="auth-card">
      <img class="peek auth-peek" src="img/peek-candle.svg" alt="" width="58" height="106" />
      <h1>Set a new password</h1>
      <p class="text-muted" id="reset-intro">Choose a new password for your account.</p>

      <div class="form-error" id="form-error" style="display:none;"></div>

      <form id="reset-password-form">
        <label for="password">New password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="8" />

        <label for="password-confirm">Confirm new password</label>
        <input type="password" id="password-confirm" required autocomplete="new-password" minlength="8" />

        <button type="submit" class="btn btn-gradient btn-block">Set new password</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>

  <script src="js/shared.js?v=18"></script>
  <script src="js/auth-forms.js?v=8"></script>
</body>
</html>
