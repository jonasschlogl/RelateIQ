<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · RelationshipAI</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
  <link rel="icon" href="/favicon-48.png?v=3" sizes="48x48" type="image/png" />
  <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16.png?v=3" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=66" />
</head>
<body>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-top-row">
          <a href="index.html" class="brand"><img class="brand-mark" src="logo-mark.svg" alt="" width="28" height="28" style="display:inline-block;vertical-align:middle;margin:-4px 8px 0 0" />Relationship<span>AI</span></a>
          <button class="sidebar-close-btn" id="sidebar-close-btn" type="button" aria-label="Close menu">✕</button>
        </div>
        <button class="btn btn-primary btn-block" id="new-chat-btn">+ New chat</button>
      </div>

      <nav class="sidebar-tools" id="sidebar-tools">
        <span class="sidebar-section-label">Tools</span>
        <button class="mode-tab active" data-mode="coach" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> Coach</button>
        <button class="mode-tab" data-mode="practice" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg> Practice</button>
        <a href="message.html" class="sidebar-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><path d="M8 9h8M8 13h5"/></svg> Message check</a>
        <details class="sidebar-more" id="sidebar-more">
          <summary class="sidebar-link sidebar-more-summary">More <svg class="ico nav-more-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M6 9l6 6 6-6"/></svg></summary>
          <a href="sos.html" class="sidebar-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> After a fight</a>
          <a href="playbook.html" class="sidebar-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><path d="M9 8h7M9 12h5"/></svg> Playbook</a>
          <a href="insights.html" class="sidebar-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg> Insights</a>
          <a href="daily.html" class="sidebar-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg> Daily question</a>
          <a href="share.html" class="sidebar-link"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg> Share with partner</a>
        </details>
      </nav>

      <input type="search" class="history-search" id="history-search" placeholder="Search conversations…" aria-label="Search conversations" autocomplete="off" />

      <div class="sidebar-history" id="history"></div>

      <div class="sidebar-bottom">
        <a href="dashboard.html" class="sidebar-link">My account</a>
        <button class="sidebar-link" id="logout-btn">Log out</button>
      </div>
    </aside>

    <main class="chat-wrapper">
      <header class="chat-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Open menu">☰</button>
        <div class="topbar-account">
          <button class="btn btn-ghost btn-sm" id="share-conversation-btn" type="button" title="Share this conversation" style="display:none;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg> Share</button>
          <button class="btn btn-ghost btn-sm" id="export-summary-btn" type="button" title="Generate a summary to share with a therapist" style="display:none;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg> Export for therapist</button>
          <a href="dashboard.html" class="plan-badge" id="plan-badge" title="Manage your plan"></a>
          <a href="dashboard.html" class="usage-badge" id="usage-badge" style="display:none;" title="Daily AI messages used today (Free plan), resets tomorrow"></a>
          <span id="user-label" class="user-label"></span>
        </div>
      </header>

      <div class="partner-banner" id="partner-banner" style="display:none;">
        <div class="partner-banner-text">
          <span>Practicing a conversation with <strong id="partner-banner-name"></strong></span>
          <span class="partner-banner-scenario" id="partner-banner-scenario" style="display:none;"></span>
          <span class="partner-banner-tags" id="partner-banner-tags" style="display:none;"></span>
        </div>
        <button class="btn btn-ghost btn-sm" id="debrief-btn" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg> Get feedback</button>
      </div>

      <div class="coach-tag-bar" id="coach-tag-bar" style="display:none;">
        <span class="coach-tag-label">This conversation is about:</span>
        <div class="coach-tag-chips" id="coach-tag-chips"></div>
      </div>

      <div id="chat" class="chat-messages"></div>

      <div class="input-area" id="input-area">
        <div class="edit-mode-banner" id="edit-mode-banner" style="display:none;">
          <span>Editing your message</span>
          <button type="button" id="cancel-edit-btn">Cancel</button>
        </div>
        <div class="attachment-preview" id="attachment-preview" style="display:none;"></div>
        <div class="quality-row" id="quality-row">
          <span class="quality-label">Answer quality</span>
          <div class="quality-toggle" role="group" aria-label="Answer quality for this chat">
            <button type="button" class="quality-btn" data-quality="fast" aria-pressed="false" title="Quick, efficient replies">Fast</button>
            <button type="button" class="quality-btn" data-quality="advanced" aria-pressed="false" title="Deeper, more nuanced replies">Advanced <svg class="quality-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></button>
          </div>
          <span class="quality-note" id="quality-note"></span>
        </div>
        <div class="composer-row" id="composer">
          <input type="file" id="file-input" multiple style="display:none;" />
          <button class="attach-btn" id="attach-btn" type="button" title="Attach a photo, screen recording, or file" aria-label="Attach a photo, screen recording, or file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95L9.64 17.62a2 2 0 01-2.83-2.83l8.49-8.49"/></svg>
          </button>
          <button class="mic-btn" id="mic-btn" type="button" title="Dictate a message" aria-label="Dictate a message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <textarea id="input" placeholder="Tell me what's going on in your relationship…" rows="1"></textarea>
          <button class="btn btn-primary" id="send-btn">Send</button>
        </div>
      </div>

      <p class="chat-disclaimer" id="chat-disclaimer">RelationshipAI is an AI tool for support, not a replacement for professional therapy.</p>
    </main>
  </div>

  <div class="modal-overlay" id="share-conversation-modal" style="display:none;">
    <div class="modal-card" id="share-conversation-modal-body"></div>
  </div>

  <script src="js/shared.js?v=21"></script>
  <script src="js/chat.js?v=51"></script>
</body>
</html>
