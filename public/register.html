<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · RelationshipAI</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
  <link rel="icon" href="/favicon-48.png?v=3" sizes="48x48" type="image/png" />
  <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16.png?v=3" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=65" />
  <link rel="stylesheet" href="css/app-theme.css?v=5" />
  <script src="js/i18n.js?v=1"></script>
</head>
<body>

  <div class="auth-page">
    <a href="https://relationshipaiadvice.com/" class="brand auth-brand"><img class="brand-mark" src="logo-mark.svg" alt="" width="40" height="40" /><b class="brand-text">Relationship<span>AI</span></b></a>

    <aside class="auth-art" aria-hidden="true">
      <img src="img/auth/art-b.webp?v=2" alt="" width="1200" height="800" />
      <div class="art-chips"><span>Private</span><span>Free to start</span></div>
      <div class="art-copy"><h2>Know how <em>you</em> love.</h2><p>A calm, private coach for texts, fights and the talks that matter. Free to start, no card.</p></div>
    </aside>

    <div class="auth-card">
      <img class="peek auth-peek" src="img/peek-heart.svg" alt="" width="92" height="110" />
      <h1>Create your account</h1>
      <p class="text-muted">Free, no credit card. Takes less than a minute.</p>

      <div class="form-error" id="form-error" style="display:none;"></div>

      <form id="register-form">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />

        <label class="consent-row" for="accept-terms">
          <input type="checkbox" id="accept-terms" required />
          <span>I'm at least 18 and I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btn btn-gradient btn-block">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script src="js/shared.js?v=23"></script>
  <script src="js/auth-forms.js?v=11"></script>
</body>
</html>
